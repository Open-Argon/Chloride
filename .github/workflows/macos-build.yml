name: macOS Build (Jenkins-triggered)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag or branch) to build"
        required: true
      build_name:
        description: "Build version string (from Jenkins)"
        required: true

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      # -------------------
      # Checkout requested ref
      # -------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      # -------------------
      # Checkout Isotope
      # -------------------
      - name: Checkout Isotope
        run: |
          set -e
          rm -rf isotope-src
          git clone --depth 1 https://git.wbell.dev/Open-Argon/Isotope.git isotope-src

      # -------------------
      # Install dependencies
      # -------------------
      - name: Install dependencies
        run: |
          set -e

          brew update
          brew install cmake python ninja flex go

          python3 -m venv /tmp/venv
          source /tmp/venv/bin/activate

          pip install --upgrade pip
          pip install conan

          mkdir -p archives
          rm -rf archives/* *.zip *.tar.gz

      # -------------------
      # Setup Conan
      # -------------------
      - name: Setup Conan profile
        run: |
          set -e

          source /tmp/venv/bin/activate

          rm -rf ~/.conan2
          conan profile detect

      # -------------------
      # Build Argon
      # -------------------
      - name: Build Argon
        run: |
          set -e

          source /tmp/venv/bin/activate

          rm -rf out/macos

          conan install . \
            --build=missing \
            -of "out/macos"

          conan build . \
            -of "out/macos"

          cp -r stdlib out/macos/build/dist/

          ./build-stdlib.sh \
            out/macos/build/dist/stdlib \
            -j ARGON_INCLUDE="$(realpath include)"

      # -------------------
      # Build Isotope
      # -------------------
      - name: Build Isotope
        run: |
          set -e

          mkdir -p out/macos/build/dist/bin

          cd isotope-src

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o ../out/macos/build/dist/bin/isotope \
            ./src

          file ../out/macos/build/dist/bin/isotope

      # -------------------
      # Package artifact
      # -------------------
      - name: Package artifact
        run: |
          set -e

          BUILD_NAME="${{ inputs.build_name }}"
          OUTPUT_FILE="archives/argon-${BUILD_NAME}-macos-arm64.tar.gz"

          cp LICENSE.txt out/macos/build/dist/
          cp -r LICENSES out/macos/build/dist/
          cp -r include out/macos/build/dist/

          tar -czf "$OUTPUT_FILE" \
            -C out/macos/build/dist .

          echo "Packaged $OUTPUT_FILE"

      # -------------------
      # Upload
      # -------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: archives/argon-*-macos-arm64.tar.gz