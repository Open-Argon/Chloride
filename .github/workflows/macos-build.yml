name: macOS Build (Jenkins-triggered)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag or branch) to build"
        required: true
      build_name:
        description: "Build version string (from Jenkins)"
        required: true

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            conan_arch: armv8
            runner: macos-latest

          - arch: x86_64
            conan_arch: x86_64
            runner: macos-13

    runs-on: ${{ matrix.runner }}

    steps:
      # -------------------
      # Show build environment
      # -------------------
      - name: Show build environment
        run: |
          set -e

          echo "Runner: $(uname -m)"
          echo "Target: ${{ matrix.arch }}"

      # -------------------
      # Checkout requested ref
      # -------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      # -------------------
      # Checkout Isotope
      # -------------------
      - name: Checkout Isotope
        run: |
          set -e
          rm -rf isotope-src
          git clone --depth 1 https://git.wbell.dev/Open-Argon/Isotope.git isotope-src

      # -------------------
      # Install dependencies
      # -------------------
      - name: Install dependencies
        run: |
          set -e

          brew update
          brew install cmake python ninja flex go

          python3 -m venv /tmp/venv
          source /tmp/venv/bin/activate

          pip install --upgrade pip
          pip install conan

          mkdir -p archives
          rm -rf archives/* *.zip *.tar.gz

      # -------------------
      # Setup Conan
      # -------------------
      - name: Setup Conan profile
        run: |
          set -e

          source /tmp/venv/bin/activate

          rm -rf ~/.conan2
          conan profile detect

          echo "Detected Conan profile:"
          conan profile show

      # -------------------
      # Build Argon
      # -------------------
      - name: Build Argon
        run: |
          set -e

          source /tmp/venv/bin/activate

          rm -rf out/macos

          conan install . \
            --build=missing \
            -of "out/macos" \
            -s:h arch=${{ matrix.conan_arch }}

          conan build . \
            -of "out/macos" \
            -s:h arch=${{ matrix.conan_arch }}

          cp -r stdlib out/macos/build/dist/

          ./build-stdlib.sh \
            out/macos/build/dist/stdlib \
            -j ARGON_INCLUDE="$(realpath include)"

      # -------------------
      # Build Isotope
      # -------------------
      - name: Build Isotope
        run: |
          set -e

          mkdir -p out/macos/build/dist/bin

          cd isotope-src

          GOARCH=${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }} \
            go build \
              -trimpath \
              -ldflags="-s -w" \
              -o ../out/macos/build/dist/bin/isotope \
              ./src

          file ../out/macos/build/dist/bin/isotope

      # -------------------
      # Verify binaries
      # -------------------
      - name: Verify architecture
        run: |
          set -e

          echo "Argon:"
          file out/macos/build/dist/* || true

          echo
          echo "Isotope:"
          file out/macos/build/dist/bin/isotope

          echo
          echo "Runner:"
          uname -m

      # -------------------
      # Package artifact
      # -------------------
      - name: Package artifact
        run: |
          set -e

          BUILD_NAME="${{ inputs.build_name }}"
          OUTPUT_FILE="archives/argon-${BUILD_NAME}-macos-${{ matrix.arch }}.tar.gz"

          cp LICENSE.txt out/macos/build/dist/
          cp -r LICENSES out/macos/build/dist/
          cp -r include out/macos/build/dist/

          tar -czf "$OUTPUT_FILE" \
            -C out/macos/build/dist .

          echo "Packaged $OUTPUT_FILE"

      # -------------------
      # Upload artifact
      # -------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-${{ matrix.arch }}
          path: archives/argon-*-macos-${{ matrix.arch }}.tar.gz