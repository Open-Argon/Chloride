name: macOS Build (Jenkins-triggered)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag or branch) to build"
        required: true
      build_name:
        description: "Build version string (from Jenkins)"
        required: true

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            conan_arch: armv8
          # - arch: x86_64
          #   conan_arch: x86_64

    steps:
      # -------------------
      # Checkout requested ref
      # -------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      # -------------------
      # Checkout Isotope
      # -------------------
      - name: Checkout Isotope
        run: |
          set -e
          rm -rf isotope-src
          git clone --depth 1 https://git.wbell.dev/Open-Argon/Isotope.git isotope-src

      # -------------------
      # Install Rosetta 2 (only needed for x86_64 on arm64 runners)
      # -------------------
      - name: Install Rosetta 2
        if: matrix.arch == 'x86_64'
        run: |
          set -e
          softwareupdate --install-rosetta --agree-to-license || true

      # -------------------
      # Install dependencies (arm64 - native)
      # -------------------
      - name: Install dependencies (arm64)
        if: matrix.arch == 'arm64'
        run: |
          set -e

          brew update
          brew install cmake python ninja flex go
          brew install zstd xz bzip2 lz4 libxml2 openssl@3 libiconv

          python3 -m venv /tmp/venv
          source /tmp/venv/bin/activate

          pip install --upgrade pip
          pip install conan

          mkdir -p archives
          rm -rf archives/* *.zip *.tar.gz

      # -------------------
      # Install dependencies (x86_64 via Rosetta)
      # -------------------
      - name: Install dependencies (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          set -e

          # Some GitHub macOS images ship stale/partial Intel Homebrew
          # remnants at /usr/local even on arm64 runners. Clear them so
          # the fresh x86_64 Homebrew install doesn't collide.
          if [ -d /usr/local/Homebrew ] || [ -e /usr/local/bin/brew ]; then
            sudo rm -rf /usr/local/Homebrew /usr/local/bin/brew
          fi
          sudo rm -rf /usr/local/bin/python3* /usr/local/bin/pip3* \
                      /usr/local/bin/idle3* /usr/local/bin/pydoc3* \
                      /usr/local/bin/wheel3* 2>/dev/null || true

          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" </dev/null

          arch -x86_64 /usr/local/bin/brew update

          # Install, and if linking fails due to leftover conflicts,
          # force-overwrite rather than aborting the whole job.
          arch -x86_64 /usr/local/bin/brew install cmake python ninja flex go \
            || arch -x86_64 /usr/local/bin/brew link --overwrite python cmake ninja go

          arch -x86_64 /usr/local/bin/python3 -m venv /tmp/venv
          source /tmp/venv/bin/activate

          arch -x86_64 pip install --upgrade pip
          arch -x86_64 pip install conan

          mkdir -p archives
          rm -rf archives/* *.zip *.tar.gz

      # -------------------
      # Setup Conan (arm64)
      # -------------------
      - name: Setup Conan profile (arm64)
        if: matrix.arch == 'arm64'
        run: |
          set -e

          source /tmp/venv/bin/activate

          rm -rf ~/.conan2
          conan profile detect

      # -------------------
      # Setup Conan (x86_64)
      # -------------------
      - name: Setup Conan profile (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          set -e

          source /tmp/venv/bin/activate

          rm -rf ~/.conan2
          arch -x86_64 conan profile detect

          # Force the detected profile to target x86_64 explicitly,
          # since auto-detection under Rosetta can be inconsistent.
          sed -i '' 's/^arch=.*/arch=x86_64/' ~/.conan2/profiles/default

      # -------------------
      # Build Argon (arm64)
      # -------------------
      # -------------------
      # Download latest stable Argon (macOS) from Jenkins
      # -------------------
      - name: Download latest Argon build from Jenkins
        run: |
          set -e

          JENKINS_JOB="https://jenkins.wbell.dev/job/Argon/lastSuccessfulBuild"

          ARTIFACT_PATH=$(curl -fsSL -g "${JENKINS_JOB}/api/json?tree=artifacts[relativePath]" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for a in data['artifacts']:
              if 'macos-${{ matrix.arch }}' in a['relativePath'] and a['relativePath'].endswith('.tar.gz'):
                  print(a['relativePath'])
                  break
          ")

          if [ -z "$ARTIFACT_PATH" ]; then
            echo "No macos-${{ matrix.arch }} artifact found in latest successful build" >&2
            exit 1
          fi

          echo "Downloading: $ARTIFACT_PATH"
          curl -fsSL "${JENKINS_JOB}/artifact/${ARTIFACT_PATH}" -o argon-bootstrap.tar.gz

          mkdir -p bootstrap-argon
          tar -xzf argon-bootstrap.tar.gz -C bootstrap-argon

          chmod +x bootstrap-argon/bin/argon bootstrap-argon/bin/isotope

      - name: Build Argon (arm64)
        if: matrix.arch == 'arm64'
        run: |
          set -e

          source /tmp/venv/bin/activate

          rm -rf out/macos-arm64

          conan install . \
            --build=missing \
            -of "out/macos-arm64"

          conan build . \
            -of "out/macos-arm64"

          cp -r stdlib out/macos-arm64/build/dist/

          export ARGON_INCLUDE="$(realpath include)"

          ./build-stdlib.sh \
            out/macos-arm64/build/dist/stdlib \
            -j ARGON_INCLUDE="$(realpath include)"

      # -------------------
      # Build Argon (x86_64)
      # -------------------
      - name: Build Argon (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          set -e

          source /tmp/venv/bin/activate

          rm -rf out/macos-x86_64

          arch -x86_64 conan install . \
            --build=missing \
            -s arch=x86_64 \
            -of "out/macos-x86_64"

          arch -x86_64 conan build . \
            -s arch=x86_64 \
            -of "out/macos-x86_64"

          cp -r stdlib out/macos-x86_64/build/dist/

          ARGON_INCLUDE="$(realpath include)"

          arch -x86_64 ./build-stdlib.sh \
            out/macos-x86_64/build/dist/stdlib \
            -j ARGON_INCLUDE="$(realpath include)"

      # -------------------
      # Build Isotope (Go, bootstrap)
      # -------------------
      - name: Build Isotope
        run: |
          set -e

          mkdir -p "out/macos-${{ matrix.arch }}/build/dist/bin"

          cd isotope-src

          GOOS=darwin GOARCH=${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }} go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "../out/macos-${{ matrix.arch }}/build/dist/bin/isotope" \
            ./src

          file "../out/macos-${{ matrix.arch }}/build/dist/bin/isotope"

      # -------------------
      # Bootstrap new Isotope (argon isotope)
      # -------------------
      - name: Bootstrap Isotope via argon isotope
        run: |
          set -e

          export PATH="$(pwd)/bootstrap-argon/bin:$PATH"

          cd "out/macos-${{ matrix.arch }}/build/dist"

          BUILD_NAME="${{ inputs.build_name }}"

          cat > argon-package.json << EOF
          {
              "name": "chloride",
              "version": "$BUILD_NAME",
              "dependencies": {}
          }
          EOF
          # cat > iso-lock.json << EOF
          # {
          #     "packages": {}
          # }
          # EOF

          ./bin/isotope install isotope

      # -------------------
      # Package artifact
      # -------------------
      - name: Package artifact
        run: |
          set -e

          BUILD_NAME="${{ inputs.build_name }}"
          ARCH="${{ matrix.arch }}"
          OUTPUT_FILE="archives/argon-${BUILD_NAME}-macos-${ARCH}.tar.gz"

          cp LICENSE.txt "out/macos-${ARCH}/build/dist/"
          cp -r LICENSES "out/macos-${ARCH}/build/dist/"
          cp -r include "out/macos-${ARCH}/build/dist/"

          tar -czf "$OUTPUT_FILE" \
            -C "out/macos-${ARCH}/build/dist" .

          echo "Packaged $OUTPUT_FILE"

      # -------------------
      # Upload
      # -------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-${{ matrix.arch }}
          path: archives/argon-*-macos-${{ matrix.arch }}.tar.gz